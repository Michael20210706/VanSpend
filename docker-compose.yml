services:
  app:
    build: .
    # 只绑定本机回环: 公网流量只能经 cloudflared(Cloudflare Tunnel)进来，不能绕过它直连 3000。
    # 这也是 CF-Connecting-IP 请求头可信的前提(登录防爆破按它取客户端 IP)，不要改回 0.0.0.0。
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    # 容器内连 compose 自带的 mysql 服务: 这里的 environment 优先于 env_file，所以 .env 里的 MYSQL_HOST/MYSQL_PORT
    # 可以保持写成"宿主机视角"的地址(给 npm run dev / npm test 用，见 docker-compose.override.yml 的说明)，两边共用一份 .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # 公网入口: Cloudflare Tunnel。在 Cloudflare Zero Trust 后台建 Tunnel，Public Hostname 的服务地址填
  # http://app:3000，把 token 填进 .env 的 TUNNEL_TOKEN，然后:
  #   docker compose --profile tunnel up -d
  # 不加 --profile tunnel 时不启动本服务(本地试用不需要)。
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["tunnel"]

  # 自带的 MySQL(默认就用它): 不映射端口到宿主机，只有 compose 网络里的 app 能连——不对局域网/公网暴露。
  # 版本固定为 8.4.7(与此前外部实例同一个小版本，数据迁移无兼容问题)。数据在命名卷 mysql-data 里，
  # `docker compose down` 不会删它(`down -v` 才会，别加 -v)。
  # 首次启动时按下面的环境变量创建 root(强密码，必填)、MYSQL_DATABASE 库和只有该库权限的专用账号 MYSQL_USER；
  # 表结构由应用启动时自动创建/升级(不再挂载 sql/schema.sql)。MYSQL_USER 不能是 root。
  # 若已有外部 MySQL，删掉这个 service 和 app 的 depends_on/environment 里的 MYSQL_HOST/PORT，把 .env 指向那个实例即可。
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vanspend}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 里设置 MYSQL_USER(不能是 root)}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 让变量在容器里的 shell 里展开(密码不会出现在 compose 配置/docker inspect 的命令行里)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
