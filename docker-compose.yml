services:
  app:
    build: .
    # 只绑定本机回环: 公网流量只能经 cloudflared(Cloudflare Tunnel)进来，不能绕过它直连 3000。
    # 这也是 CF-Connecting-IP 请求头可信的前提(登录防爆破按它取客户端 IP)，不要改回 0.0.0.0。
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # 公网入口: Cloudflare Tunnel。在 Cloudflare Zero Trust 后台建 Tunnel，Public Hostname 的服务地址填
  # http://app:3000，把 token 填进 .env 的 TUNNEL_TOKEN，然后:
  #   docker compose --profile tunnel up -d
  # 不加 --profile tunnel 时不启动本服务(本地试用不需要)。
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["tunnel"]

  # 本地/演示用的 MySQL(不映射端口到宿主机，只有 compose 内部的 app 能连)；若已有外部 MySQL，删掉这个 service，
  # 并把 .env 里的 MYSQL_HOST/PORT 指向那个外部实例即可。
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vanspend}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
