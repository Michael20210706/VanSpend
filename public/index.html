<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VanSpend · 小票扫描记账</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0b0f16; --card:#1a2230; --card2:#141b28; --line:#2a3548; --txt:#e6edf3; --mut:#8b98a9;
    --acc:#3987e5; --acc-ink:#ffffff;
    --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;
    /* 图表分类色(已通过 CVD/对比度校验，见 dataviz skill) */
    --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300; --s5:#9085e9; --s6:#e66767; --s7:#d55181; --s8:#d95926;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
    --radius: 12px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif; background:
    radial-gradient(1100px 480px at 12% -10%, rgba(57,135,229,.10), transparent 60%),
    var(--bg); color:var(--txt); -webkit-font-smoothing:antialiased; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:rgba(255,255,255,.02); backdrop-filter:blur(6px); position:sticky; top:0; z-index:40; }
  header h1 { font-size:18px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .meta { color:var(--mut); font-size:13px; }
  .badge { font-size:12px; padding:3px 10px; border-radius:20px; font-weight:600; letter-spacing:.2px; }
  .badge.ok { background:rgba(12,163,12,.15); color:var(--good); }
  .badge.no { background:rgba(208,59,59,.15); color:var(--bad); }
  .wrap { max-width:1180px; margin:0 auto; padding:28px 24px 60px; }
  .grid { display:grid; gap:18px; animation:fadeIn .32s ease; }
  @keyframes fadeIn { from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }
  .card { background:linear-gradient(180deg, var(--card), var(--card2)); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); transition:border-color .15s ease; }
  .card h2 { font-size:15px; margin:0 0 14px; font-weight:600; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  button { background:var(--acc); color:var(--acc-ink); border:0; border-radius:8px; padding:9px 16px; font-size:14px;
    font-weight:600; cursor:pointer; transition:filter .12s ease, transform .08s ease; }
  button:hover:not(:disabled) { filter:brightness(1.1); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.ghost:hover:not(:disabled) { background:rgba(255,255,255,.06); border-color:#3a4763; filter:none; }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); padding:4px 10px; font-size:12px; font-weight:600; }
  button.danger:hover { background:rgba(208,59,59,.12); filter:none; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input, select { background:#0d1117; border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:7px 9px; font-size:13px;
    transition:border-color .12s ease, box-shadow .12s ease; }
  input:focus, select:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(57,135,229,.20); }
  #drop { border:2px dashed var(--line); border-radius:var(--radius); padding:34px; text-align:center; color:var(--mut); cursor:pointer; transition:.15s; }
  #drop:hover { border-color:#3a4763; color:var(--txt); }
  #drop.hover { border-color:var(--acc); color:var(--txt); background:rgba(57,135,229,.06); }
  #preview { max-height:260px; border-radius:8px; margin-top:12px; display:none; box-shadow:var(--shadow); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  tbody tr { transition:background-color .1s ease; }
  tbody tr:hover { background:rgba(255,255,255,.03); }
  td input, td select { width:100%; padding:4px 6px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .cards4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .kpi { background:#0d1117; border:1px solid var(--line); border-top:2px solid var(--acc); border-radius:10px; padding:14px 16px;
    box-shadow:var(--shadow); transition:transform .12s ease, border-color .12s ease; }
  .kpi:hover { transform:translateY(-2px); border-color:#3a4763; }
  .kpi .v { font-size:23px; font-weight:700; font-variant-numeric:tabular-nums; }
  .kpi .l { color:var(--mut); font-size:12px; margin-top:4px; }
  .chartbox { position:relative; height:280px; }
  .muted { color:var(--mut); font-size:13px; }
  .empty { text-align:center; color:var(--mut); padding:32px 12px !important; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#151c28; border:1px solid var(--line);
    padding:11px 18px; border-radius:8px; display:none; z-index:50; box-shadow:var(--shadow); }
  .tabs { display:flex; gap:6px; margin-bottom:18px; background:rgba(255,255,255,.03); padding:4px; border-radius:10px; width:fit-content; }
  .tab { padding:8px 16px; border-radius:7px; cursor:pointer; color:var(--mut); border:1px solid transparent; font-size:13px; font-weight:500;
    transition:color .12s ease, background-color .12s ease; }
  .tab:hover { color:var(--txt); }
  .tab.active { background:var(--acc); color:var(--acc-ink); font-weight:600; }
  .hide { display:none; }
  a { color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>🧾 VanSpend</h1>
  <span class="meta">温哥华家庭小票精细化记账 · GST/PST 拆分</span>
  <span id="keyBadge" class="badge no">Key 未配置</span>
  <span class="meta" id="modelMeta"></span>
  <span style="flex:1"></span>
  <span class="meta hide" id="userBox"><span id="userName"></span> · <a href="#" id="logoutBtn">退出</a></span>
</header>

<div class="wrap hide" id="authWrap" style="max-width:380px">
  <div class="card">
    <h2 id="authTitle">登录</h2>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
      <input id="auth-username" placeholder="用户名" autocomplete="username">
      <input id="auth-password" type="password" placeholder="密码" autocomplete="current-password">
      <button id="authSubmit">登录</button>
      <span id="authErr" style="color:var(--bad);font-size:13px"></span>
      <a href="#" id="authToggle" class="meta">没有账号？点此注册</a>
    </div>
  </div>
</div>

<div class="wrap hide" id="appWrap">
  <div class="tabs">
    <div class="tab active" data-tab="scan">上传识别</div>
    <div class="tab" data-tab="dash">数据分析</div>
    <div class="tab" data-tab="list">小票记录</div>
  </div>

  <!-- ============ 上传识别 ============ -->
  <section id="tab-scan" class="grid">
    <div class="card">
      <h2>1 · 上传小票图片</h2>
      <div id="drop">点击或拖拽小票图片到这里（支持 Costco / 大统华 等）</div>
      <input type="file" id="file" accept="image/*" class="hide" />
      <img id="preview" />
      <div class="row" style="margin-top:14px">
        <button id="scanBtn" disabled>AI 识别</button>
        <span class="muted" id="scanHint"></span>
      </div>
    </div>

    <div class="card hide" id="editCard">
      <h2>2 · 核对并保存</h2>
      <div class="row" style="margin-bottom:12px">
        <label>商家 <input id="f-store" style="width:140px"></label>
        <label>日期 <input id="f-date" type="date"></label>
        <label>税前 <input id="f-subtotal" type="number" step="0.01" style="width:90px" class="num"></label>
        <label>GST <input id="f-gst" type="number" step="0.01" style="width:80px" class="num"></label>
        <label>PST <input id="f-pst" type="number" step="0.01" style="width:80px" class="num"></label>
        <label>实付 <input id="f-total" type="number" step="0.01" style="width:90px" class="num"></label>
      </div>
      <table id="itemTable">
        <thead><tr>
          <th>原文品名</th><th>规范品名</th><th>分类</th><th>细分</th>
          <th class="num">数量</th><th>单位</th><th class="num">单价</th><th class="num">金额</th><th>税</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div class="row" style="margin-top:14px">
        <button id="addRow" class="ghost">+ 添加一行</button>
        <button id="saveBtn">保存到账本</button>
      </div>
    </div>
  </section>

  <!-- ============ 数据分析 ============ -->
  <section id="tab-dash" class="grid hide">
    <div class="card">
      <div class="row">
        <label>从 <input id="d-from" type="date"></label>
        <label>到 <input id="d-to" type="date"></label>
        <button id="applyRange">应用</button>
        <button id="clearRange" class="ghost">全部时间</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" data-preset="thisMonth">当月</button>
        <button class="ghost" data-preset="lastMonth">上月</button>
        <button class="ghost" data-preset="last3m">近3个月</button>
        <button class="ghost" data-preset="last6m">近半年</button>
        <button class="ghost" data-preset="last1y">近1年</button>
      </div>
    </div>
    <div class="cards4" id="kpis"></div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><h2>各分类花费占比</h2><div class="chartbox"><canvas id="catChart"></canvas></div></div>
      <div class="card">
        <h2>细分花费 <select id="subSel" style="margin-left:8px"></select></h2>
        <div class="chartbox"><canvas id="subChart"></canvas></div>
      </div>
    </div>
    <div class="card"><h2>月度花费与税额</h2><div class="chartbox"><canvas id="monChart"></canvas></div></div>
    <div class="card">
      <h2>价格趋势</h2>
      <div class="row" style="margin-bottom:12px">
        <input id="trendName" list="nameList" placeholder="输入品名，如 牛肉 / 三文鱼" style="width:220px">
        <datalist id="nameList"></datalist>
        <input id="trendStore" placeholder="商家(可选)" style="width:140px">
        <button id="trendBtn">查询</button>
      </div>
      <div class="chartbox"><canvas id="trendChart"></canvas></div>
      <div id="trendTbl"></div>
    </div>
  </section>

  <!-- ============ 小票记录 ============ -->
  <section id="tab-list" class="grid hide">
    <div class="card">
      <h2>小票记录</h2>
      <div class="row" style="margin-bottom:10px">
        <label>从 <input id="r-from" type="date"></label>
        <label>到 <input id="r-to" type="date"></label>
        <input id="r-search" placeholder="搜索商家或品名" style="width:200px">
        <button id="r-apply">筛选</button>
        <button id="r-clear" class="ghost">清除</button>
      </div>
      <div class="row" style="margin-bottom:14px">
        <button class="ghost" data-preset="thisMonth">当月</button>
        <button class="ghost" data-preset="lastMonth">上月</button>
        <button class="ghost" data-preset="last3m">近3个月</button>
        <button class="ghost" data-preset="last6m">近半年</button>
        <button class="ghost" data-preset="last1y">近1年</button>
      </div>
      <table id="recTable">
        <thead><tr><th>日期</th><th>商家</th><th class="num">税前</th><th class="num">GST</th><th class="num">PST</th><th class="num">实付</th><th class="num">条目</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card hide" id="recDetail"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = (u, o) => fetch(u, o).then(async r => {
  const j = await r.json();
  if(!r.ok) { if(r.status===401) showAuth(); throw new Error(j.error||'请求失败'); }
  return j;
});
const fmt = (n) => (n==null||isNaN(n)) ? '-' : Number(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
let CFG = { categories:[] }, currentImage = null, charts = {};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2600); }

// ---- 登录 / 注册 ----
function showApp(username){
  $('#authWrap').classList.add('hide');
  $('#appWrap').classList.remove('hide');
  $('#userBox').classList.remove('hide');
  $('#userName').textContent = username;
}
function showAuth(){
  $('#appWrap').classList.add('hide');
  $('#userBox').classList.add('hide');
  $('#authWrap').classList.remove('hide');
  $('#auth-password').value = '';
}
let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  $('#authTitle').textContent = mode==='login' ? '登录' : '注册';
  $('#authSubmit').textContent = mode==='login' ? '登录' : '注册';
  $('#authToggle').textContent = mode==='login' ? '没有账号？点此注册' : '已有账号？点此登录';
  $('#authErr').textContent = '';
}
$('#authToggle').onclick = (e) => { e.preventDefault(); setAuthMode(authMode==='login'?'register':'login'); };
$('#authSubmit').onclick = async () => {
  const username = $('#auth-username').value.trim();
  const password = $('#auth-password').value;
  if(!username || !password){ $('#authErr').textContent = '请输入用户名和密码'; return; }
  try {
    const u = await api('/api/auth/'+authMode, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    showApp(u.username);
    initApp();
  } catch(e){ $('#authErr').textContent = e.message; }
};
$('#logoutBtn').onclick = async (e) => {
  e.preventDefault();
  await api('/api/auth/logout', { method:'POST' });
  location.reload();
};

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  ['scan','dash','list'].forEach(n => $('#tab-'+n).classList.toggle('hide', n!==t.dataset.tab));
  if(t.dataset.tab==='dash') loadDashboard();
  if(t.dataset.tab==='list') loadReceipts();
});

// ---- init ----
function initApp(){
  api('/api/config').then(c => {
    CFG = c;
    $('#modelMeta').textContent = '模型: ' + c.model;
    const b = $('#keyBadge');
    b.className = 'badge ' + (c.hasKey?'ok':'no');
    b.textContent = c.hasKey ? 'Key 已配置' : 'Key 未配置 (改 .env)';
    $('#subSel').innerHTML = c.categories.map(x=>`<option>${x}</option>`).join('');
    $('#subSel').value = '肉类';
  });
}
api('/api/auth/me').then(u => { showApp(u.username); initApp(); }).catch(() => showAuth());

// ---- upload ----
const drop = $('#drop'), fileInput = $('#file');
drop.onclick = () => fileInput.click();
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hover');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hover');}));
drop.addEventListener('drop', ev => { if(ev.dataTransfer.files[0]) readImage(ev.dataTransfer.files[0]); });
fileInput.onchange = () => { if(fileInput.files[0]) readImage(fileInput.files[0]); };
function readImage(f){
  const r = new FileReader();
  r.onload = () => { currentImage = r.result; $('#preview').src = r.result; $('#preview').style.display='block'; $('#scanBtn').disabled=false; $('#scanHint').textContent=''; };
  r.readAsDataURL(f);
}

$('#scanBtn').onclick = async () => {
  if(!currentImage) return;
  $('#scanBtn').disabled = true; $('#scanHint').textContent = 'AI 识别中，请稍候…';
  try {
    const { receipt, items, raw } = await api('/api/scan', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ image: currentImage }) });
    fillEdit(receipt, items, raw);
    $('#scanHint').textContent = '识别完成，请核对';
  } catch(e){ $('#scanHint').textContent=''; toast('识别失败: '+e.message); }
  $('#scanBtn').disabled = false;
};

let lastRaw = null;
function fillEdit(r, items, raw){
  lastRaw = raw;
  $('#editCard').classList.remove('hide');
  $('#f-store').value=r.store||''; $('#f-date').value=r.purchased_at||''; $('#f-subtotal').value=r.subtotal||0;
  $('#f-gst').value=r.gst||0; $('#f-pst').value=r.pst||0; $('#f-total').value=r.total||0;
  const tb = $('#itemTable tbody'); tb.innerHTML='';
  items.forEach(addItemRow);
}
function addItemRow(it={}){
  const tr = document.createElement('tr');
  const opts = CFG.categories.map(c=>`<option ${c===it.category?'selected':''}>${c}</option>`).join('');
  tr.innerHTML = `
    <td><input value="${(it.name_raw||'').replace(/"/g,'&quot;')}"></td>
    <td><input value="${(it.name_norm||'').replace(/"/g,'&quot;')}"></td>
    <td><select>${opts}</select></td>
    <td><input value="${(it.subcategory||'').replace(/"/g,'&quot;')}"></td>
    <td><input type="number" step="0.01" class="num" value="${it.qty??1}"></td>
    <td><input value="${it.unit||''}"></td>
    <td><input type="number" step="0.01" class="num" value="${it.unit_price??''}"></td>
    <td><input type="number" step="0.01" class="num" value="${it.amount??0}"></td>
    <td style="text-align:center"><input type="checkbox" ${it.taxable?'checked':''}></td>
    <td><button class="danger">×</button></td>`;
  tr.querySelector('button.danger').onclick = () => tr.remove();
  $('#itemTable tbody').appendChild(tr);
}
$('#addRow').onclick = () => addItemRow();

$('#saveBtn').onclick = async () => {
  const items = [...$('#itemTable tbody').querySelectorAll('tr')].map(tr=>{
    const c = tr.querySelectorAll('input,select');
    return { name_raw:c[0].value.trim()||'未知商品', name_norm:c[1].value.trim()||null, category:c[2].value,
      subcategory:c[3].value.trim()||null, qty:+c[4].value||0, unit:c[5].value.trim()||null,
      unit_price:c[6].value===''?null:+c[6].value, amount:+c[7].value||0, taxable:c[8].checked?1:0 };
  });
  const receipt = { store:$('#f-store').value.trim()||'未知', purchased_at:$('#f-date').value||new Date().toISOString().slice(0,10),
    currency:CFG.currency||'CAD', subtotal:+$('#f-subtotal').value||0, gst:+$('#f-gst').value||0, pst:+$('#f-pst').value||0, total:+$('#f-total').value||0 };
  try {
    await api('/api/receipts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ receipt, items, image: currentImage, raw: lastRaw }) });
    toast('已保存 ✓');
    $('#editCard').classList.add('hide'); $('#preview').style.display='none'; currentImage=null; $('#scanBtn').disabled=true; fileInput.value='';
  } catch(e){ toast('保存失败: '+e.message); }
};

// ---- dashboard ----
function range(){ const f=$('#d-from').value, t=$('#d-to').value; const q=[]; if(f)q.push('from='+f); if(t)q.push('to='+t); return q.length?'?'+q.join('&'):''; }
$('#applyRange').onclick = loadDashboard;
$('#clearRange').onclick = () => { $('#d-from').value=''; $('#d-to').value=''; loadDashboard(); };
$('#subSel').onchange = loadSub;

const pad2 = (n) => String(n).padStart(2,'0');
const toISO = (d) => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function computePresetRange(kind){
  const now = new Date();
  let from, to = now;
  if(kind==='thisMonth') from = new Date(now.getFullYear(), now.getMonth(), 1);
  else if(kind==='lastMonth'){ from = new Date(now.getFullYear(), now.getMonth()-1, 1); to = new Date(now.getFullYear(), now.getMonth(), 0); }
  else if(kind==='last3m') from = new Date(now.getFullYear(), now.getMonth()-3, now.getDate());
  else if(kind==='last6m') from = new Date(now.getFullYear(), now.getMonth()-6, now.getDate());
  else if(kind==='last1y') from = new Date(now.getFullYear()-1, now.getMonth(), now.getDate());
  else return null;
  return [toISO(from), toISO(to)];
}
document.querySelectorAll('#tab-dash [data-preset]').forEach(b => b.onclick = () => {
  const r = computePresetRange(b.dataset.preset); if(!r) return;
  $('#d-from').value = r[0]; $('#d-to').value = r[1];
  loadDashboard();
});

async function loadDashboard(){
  const ov = await api('/api/stats/overview'+range());
  $('#kpis').innerHTML = [
    ['实付总额', '$'+fmt(ov.total)],['税额合计','$'+fmt(ov.tax)],['GST','$'+fmt(ov.gst)],
    ['PST','$'+fmt(ov.pst)],['小票数',ov.receipts||0],['商品条目',ov.lines||0]
  ].map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  loadCat(); loadSub(); loadMonthly(); loadNames();
}
// 分类色板: 8 个已校验(CVD/对比度)色相，按固定顺序分配，不做无依据的新色生成；
// 超过 8 个系列时复用色相但降低不透明度，弱化"长尾"分类而不是伪造新颜色
const SERIES = ['#3987e5','#199e70','#c98500','#008300','#9085e9','#e66767','#d55181','#d95926'];
function seriesColors(n){ return Array.from({length:n}, (_,i) => i<SERIES.length ? SERIES[i] : SERIES[i%SERIES.length]+'66'); }
const CHART_GAP = '#17202d'; // 卡片背景色，用作分段/环形图之间的 2px 间隔描边
function drawChart(id, type, data, options){ if(charts[id]) charts[id].destroy(); charts[id]=new Chart($('#'+id), {type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e6edf3'}}},...options}}); }
const axes = { scales:{ x:{ticks:{color:'#8b98a9'},grid:{color:'#2a3548'}}, y:{ticks:{color:'#8b98a9'},grid:{color:'#2a3548'}} } };

async function loadCat(){
  const d = await api('/api/stats/category'+range());
  drawChart('catChart','doughnut',{ labels:d.map(x=>x.label), datasets:[{data:d.map(x=>x.amount),backgroundColor:seriesColors(d.length),borderColor:CHART_GAP,borderWidth:2}] },{});
}
async function loadSub(){
  const cat = $('#subSel').value; const sep = range()?'&':'?';
  const d = await api('/api/stats/subcategory'+range()+sep+'category='+encodeURIComponent(cat));
  drawChart('subChart','bar',{ labels:d.map(x=>x.label), datasets:[{label:'花费 $',data:d.map(x=>x.amount),backgroundColor:SERIES[0],borderRadius:4,maxBarThickness:48}] },axes);
}
async function loadMonthly(){
  const d = await api('/api/stats/monthly'+range());
  drawChart('monChart','bar',{ labels:d.map(x=>x.month), datasets:[
    {label:'税前',data:d.map(x=>x.subtotal),backgroundColor:SERIES[0],stack:'s',borderColor:CHART_GAP,borderWidth:2},
    {label:'GST',data:d.map(x=>x.gst),backgroundColor:SERIES[2],stack:'s',borderColor:CHART_GAP,borderWidth:2},
    {label:'PST',data:d.map(x=>x.pst),backgroundColor:SERIES[5],stack:'s',borderColor:CHART_GAP,borderWidth:2}
  ]},{ scales:{ x:{stacked:true,ticks:{color:'#8b98a9'},grid:{color:'#2a3548'}}, y:{stacked:true,ticks:{color:'#8b98a9'},grid:{color:'#2a3548'}} } });
}
async function loadNames(){ const d = await api('/api/items/names'); $('#nameList').innerHTML = d.map(x=>`<option value="${(x.name||'').replace(/"/g,'&quot;')}">`).join(''); }

$('#trendBtn').onclick = async () => {
  const name = $('#trendName').value.trim(); if(!name) return toast('请输入品名');
  const store = $('#trendStore').value.trim();
  const d = await api('/api/stats/trend?name='+encodeURIComponent(name)+(store?'&store='+encodeURIComponent(store):''));
  if(!d.length){ toast('没有匹配记录'); }
  drawChart('trendChart','line',{ labels:d.map(x=>x.date), datasets:[{label:name+' 单价 $',data:d.map(x=>x.unit_price),
    borderColor:SERIES[0],backgroundColor:'#3987e533',pointBackgroundColor:SERIES[0],borderWidth:2,pointRadius:3,pointHoverRadius:5,tension:.25,fill:true}] },axes);
  $('#trendTbl').innerHTML = '<table><thead><tr><th>日期</th><th>商家</th><th>品名</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th></tr></thead><tbody>'+
    d.map(x=>`<tr><td>${x.date}</td><td>${x.store}</td><td>${x.name}</td><td class="num">${x.qty??'-'}</td><td class="num">${fmt(x.unit_price)}</td><td class="num">${fmt(x.amount)}</td></tr>`).join('')+'</tbody></table>';
};

// ---- receipts list ----
function recQuery(){
  const f=$('#r-from').value, t=$('#r-to').value, s=$('#r-search').value.trim();
  const q=[]; if(f)q.push('from='+f); if(t)q.push('to='+t); if(s)q.push('search='+encodeURIComponent(s));
  return q.length?'?'+q.join('&'):'';
}
$('#r-apply').onclick = loadReceipts;
$('#r-clear').onclick = () => { $('#r-from').value=''; $('#r-to').value=''; $('#r-search').value=''; loadReceipts(); };
$('#r-search').addEventListener('keydown', (e) => { if(e.key==='Enter') loadReceipts(); });
document.querySelectorAll('#tab-list [data-preset]').forEach(b => b.onclick = () => {
  const r = computePresetRange(b.dataset.preset); if(!r) return;
  $('#r-from').value = r[0]; $('#r-to').value = r[1];
  loadReceipts();
});

async function loadReceipts(){
  const d = await api('/api/receipts'+recQuery());
  $('#recTable tbody').innerHTML = d.map(r=>`<tr>
    <td>${r.purchased_at}</td><td>${r.store}</td>
    <td class="num">${fmt(r.subtotal)}</td><td class="num">${fmt(r.gst)}</td><td class="num">${fmt(r.pst)}</td>
    <td class="num">${fmt(r.total)}</td><td class="num">${r.item_count}</td>
    <td><button class="ghost" onclick="viewRec(${r.id})" style="padding:4px 10px;font-size:12px">明细</button>
        <button class="danger" onclick="delRec(${r.id})">删</button></td></tr>`).join('') || '<tr><td colspan="8" class="empty">暂无记录</td></tr>';
}
window.viewRec = async (id) => {
  const r = await api('/api/receipts/'+id);
  $('#recDetail').classList.remove('hide');
  $('#recDetail').innerHTML = `<h2>${r.store} · ${r.purchased_at}</h2>
    <p class="muted">税前 $${fmt(r.subtotal)} ｜ GST $${fmt(r.gst)} ｜ PST $${fmt(r.pst)} ｜ 实付 $${fmt(r.total)}</p>
    ${r.image_file?`<img src="/uploads/${r.image_file}" style="max-height:300px;border-radius:8px;float:right;margin-left:16px">`:''}
    <table><thead><tr><th>品名</th><th>分类</th><th>细分</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th>税</th></tr></thead><tbody>
    ${r.items.map(i=>`<tr><td>${i.name_raw}${i.name_norm&&i.name_norm!==i.name_raw?' <span class="muted">('+i.name_norm+')</span>':''}</td><td>${i.category}</td><td>${i.subcategory||'-'}</td><td class="num">${i.qty}</td><td class="num">${fmt(i.unit_price)}</td><td class="num">${fmt(i.amount)}</td><td style="text-align:center">${i.taxable?'✓':''}</td></tr>`).join('')}
    </tbody></table>`;
  $('#recDetail').scrollIntoView({behavior:'smooth'});
};
window.delRec = async (id) => { if(!confirm('确认删除这张小票？')) return; await api('/api/receipts/'+id,{method:'DELETE'}); loadReceipts(); $('#recDetail').classList.add('hide'); };
</script>
</body>
</html>
